<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">LexChain secure legal document illustration</title>
  <desc id="desc">A legal document protected by a shield and connected to blockchain nodes.</desc>
  <defs>
    <linearGradient id="bgGlow" x1="80" y1="48" x2="420" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#DDF1FF" stop-opacity=".82"/>
      <stop offset="1" stop-color="#1689F5" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="blueFill" x1="150" y1="90" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3AA2FF"/>
      <stop offset="1" stop-color="#0877E8"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="275" y1="136" x2="392" y2="281" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21A0FF"/>
      <stop offset="1" stop-color="#0B72DC"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#08264D" flood-opacity=".22"/>
    </filter>
    <filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0B4D91" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="none"/>
  <circle cx="250" cy="245" r="205" fill="url(#bgGlow)" opacity=".62"/>
  <ellipse cx="252" cy="425" rx="128" ry="18" fill="#08264D" opacity=".11"/>

  <g id="blockchain-network" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 151 L184 103 L262 132 L332 91 L398 144" stroke="#FFFFFF" stroke-width="5" opacity=".78">
      <animate attributeName="opacity" values=".42;.9;.42" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M104 151 L169 237 L84 317 L194 362 L276 315 L379 338" stroke="#FFFFFF" stroke-width="5" opacity=".58">
      <animate attributeName="opacity" values=".32;.76;.32" dur="4.2s" begin=".4s" repeatCount="indefinite"/>
    </path>
    <path d="M184 103 L169 237 L262 132 L276 315 L332 91 L379 338" stroke="#FFFFFF" stroke-width="4" opacity=".42">
      <animate attributeName="opacity" values=".24;.58;.24" dur="4s" begin=".8s" repeatCount="indefinite"/>
    </path>
    <path d="M169 237 L276 315 L398 144" stroke="#1689F5" stroke-width="3" opacity=".22">
      <animate attributeName="opacity" values=".16;.48;.16" dur="3.6s" begin=".2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g id="node-pulses" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".8">
    <circle cx="112" cy="151" r="19">
      <animate attributeName="r" values="19;28;19" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0;.55" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="184" cy="103" r="17">
      <animate attributeName="r" values="17;25;17" dur="3.2s" begin=".35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0;.5" dur="3.2s" begin=".35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="332" cy="91" r="19">
      <animate attributeName="r" values="19;29;19" dur="3.2s" begin=".7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0;.55" dur="3.2s" begin=".7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="398" cy="144" r="17">
      <animate attributeName="r" values="17;25;17" dur="3.2s" begin="1.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0;.5" dur="3.2s" begin="1.05s" repeatCount="indefinite"/>
    </circle>
    <circle cx="169" cy="237" r="22" stroke="#1689F5">
      <animate attributeName="r" values="22;34;22" dur="2.9s" begin=".25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".42;0;.42" dur="2.9s" begin=".25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="276" cy="315" r="22" stroke="#1689F5">
      <animate attributeName="r" values="22;34;22" dur="2.9s" begin=".9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".42;0;.42" dur="2.9s" begin=".9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g id="network-nodes" filter="url(#nodeShadow)">
    <circle cx="112" cy="151" r="19" fill="#FFFFFF"/>
    <circle cx="184" cy="103" r="17" fill="#FFFFFF"/>
    <circle cx="332" cy="91" r="19" fill="#FFFFFF"/>
    <circle cx="398" cy="144" r="17" fill="#FFFFFF"/>
    <circle cx="84" cy="317" r="17" fill="#FFFFFF"/>
    <circle cx="194" cy="362" r="18" fill="#FFFFFF"/>
    <circle cx="379" cy="338" r="18" fill="#FFFFFF"/>
    <circle cx="169" cy="237" r="22" fill="#FFFFFF"/>
    <circle cx="276" cy="315" r="22" fill="#FFFFFF"/>
    <path d="M169 223 L181 230 V244 L169 251 L157 244 V230 Z" fill="#1689F5"/>
    <path d="M276 301 L288 308 V322 L276 329 L264 322 V308 Z" fill="#1689F5"/>
    <path d="M332 78 L344 85 V98 L332 105 L320 98 V85 Z" fill="#1689F5"/>
    <path d="M184 93 L193 98 V108 L184 113 L175 108 V98 Z" fill="#6BB9FF"/>
    <path d="M112 140 L122 146 V156 L112 162 L102 156 V146 Z" fill="#6BB9FF"/>
    <path d="M398 134 L407 139 V149 L398 154 L389 149 V139 Z" fill="#6BB9FF"/>
    <path d="M84 307 L93 312 V322 L84 327 L75 322 V312 Z" fill="#6BB9FF"/>
    <path d="M194 351 L204 357 V368 L194 374 L184 368 V357 Z" fill="#6BB9FF"/>
    <path d="M379 327 L389 333 V344 L379 350 L369 344 V333 Z" fill="#6BB9FF"/>
  </g>

  <g id="document" filter="url(#softShadow)">
    <path d="M151 115 C151 101 162 90 176 90 H291 L353 152 V364 C353 380 340 393 324 393 H176 C162 393 151 382 151 368 Z" fill="#FFFFFF"/>
    <path d="M291 91 V137 C291 145 298 152 306 152 H353" fill="#DDF1FF"/>
    <path d="M291 91 L353 152 H306 C298 152 291 145 291 137 Z" fill="#EAF4FF"/>
    <rect x="178" y="148" width="76" height="12" rx="6" fill="#133B73"/>
    <rect x="178" y="176" width="126" height="9" rx="4.5" fill="#EAF4FF"/>
    <rect x="178" y="198" width="108" height="9" rx="4.5" fill="#EAF4FF"/>
    <rect x="178" y="220" width="132" height="9" rx="4.5" fill="#EAF4FF"/>
    <rect x="178" y="258" width="80" height="11" rx="5.5" fill="#DDF1FF"/>
    <rect x="178" y="282" width="124" height="9" rx="4.5" fill="#F3F8FF"/>
    <rect x="178" y="304" width="96" height="9" rx="4.5" fill="#F3F8FF"/>
    <g id="signature">
      <path d="M183 343 C199 326 213 365 230 341 C239 328 246 338 253 348 C263 362 278 333 295 344" stroke="#1689F5" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="178" y="354" width="122" height="5" rx="2.5" fill="#EAF4FF"/>
    </g>
  </g>

  <g id="shield" filter="url(#softShadow)">
    <path d="M341 154 C369 168 395 170 395 170 V220 C395 258 374 285 341 299 C308 285 287 258 287 220 V170 C287 170 313 168 341 154 Z" fill="url(#shieldFill)"/>
    <path d="M321 220 L336 235 L365 198" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M317 173 C331 170 341 164 341 164 C341 164 364 176 384 176" stroke="#FFFFFF" stroke-width="4" opacity=".35" fill="none" stroke-linecap="round"/>
  </g>

  <g id="lock-pill">
    <rect x="268" y="327" width="142" height="44" rx="22" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <circle cx="292" cy="349" r="14" fill="#EAF4FF"/>
    <path d="M287 348 V344 C287 340 289 337 293 337 C297 337 299 340 299 344 V348" stroke="#1689F5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="285" y="347" width="16" height="12" rx="3" fill="#1689F5"/>
    <rect x="314" y="342" width="72" height="6" rx="3" fill="#133B73" opacity=".88"/>
    <rect x="314" y="354" width="54" height="5" rx="2.5" fill="#6F8FB5" opacity=".55"/>
  </g>

  <g id="verified-chip">
    <rect x="92" y="244" width="126" height="42" rx="21" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <circle cx="115" cy="265" r="12" fill="#DDF1FF"/>
    <path d="M110 265 L114 269 L122 259" stroke="#1689F5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="134" y="258" width="54" height="6" rx="3" fill="#133B73" opacity=".88"/>
    <rect x="134" y="270" width="38" height="5" rx="2.5" fill="#6F8FB5" opacity=".55"/>
  </g>

  <g id="hash-chip">
    <rect x="97" y="379" width="158" height="40" rx="20" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <circle cx="120" cy="399" r="6" fill="#18B884"/>
    <text x="137" y="404" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#133B73">0xA13...9F2</text>
  </g>
</svg>
